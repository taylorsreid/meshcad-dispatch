syntax = "proto3";

// Go package name
option go_package = "../meshcadprotos"; 

enum Collection {
    unknown_collection = 0;
    users = 1;
    incidents = 2;
    incidentEvents = 3;
}

message Read {
    bool multiple = 1;
    Collection collection = 2;
    optional string filter = 3;
    optional string sort = 4;
    optional uint32 limit = 5;
    optional uint32 offset = 6;
}