syntax = "proto3";

// Go package name
option go_package = "../meshcadprotos"; 

message CreateUser {
    // string email = 1;
    // string password = 2;
    // string name = 3;
    string first_name = 1;
    string last_name = 2;
    string email = 3;
}

message UpdateUser {
    uint32 id = 1;
    optional string email = 2;
    optional string password = 3;
    optional string name = 4;
    optional string status = 5;
}

message AuthorizeUser {
    string email = 1;
    string password =2;
}